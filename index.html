<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>elmotec.net</title>
    <meta name="description" content="Tools and technical references from elmotec.net.">
    <style>
        :root {
            color-scheme: light dark;
            --blue: #0379ca;
            --link-hover: #024c7f;
            --ink: #2e2e2e;
            --muted: #777;
            --border: #c7c7c7;
            --white: #fff;
            --yellow: #ffd800;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--white);
            color: var(--ink);
            font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        main {
            width: min(100% - 40px, 800px);
            margin-inline: auto;
            padding-block: clamp(56px, 10vw, 104px);
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: clamp(36px, 6vw, 48px);
            line-height: 1.2;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 24px;
            line-height: 1.3;
        }

        a {
            color: var(--blue);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration-thickness: 2px;
        }

        a:focus-visible {
            outline: 3px solid var(--yellow);
            outline-offset: 3px;
        }

        .lede {
            margin-bottom: 48px;
            color: var(--muted);
            font-size: 20px;
        }

        .resources {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .resources li {
            border-top: 1px solid var(--border);
            padding-block: 28px;
        }

        .resources li:last-child {
            border-bottom: 1px solid var(--border);
        }

        .resources p {
            max-width: 640px;
            margin-bottom: 0;
            color: var(--muted);
        }

        .formats {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --blue: #58b4f5;
                --link-hover: #9bd3fa;
                --ink: #f0f0f0;
                --muted: #b8b8b8;
                --border: #555;
                --white: #171717;
                --yellow: #e6c200;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>elmotec.net</h1>
        <p class="lede">Tools and technical references.</p>

        <ul class="resources" aria-label="Resources">
            <li>
                <h2>U.S. Treasury auction calendar</h2>
                <p><a href="/treasurydirect-auctions-ical/">Subscribe to announced Treasury security auction dates</a> in your calendar app.</p>
            </li>
            <li>
                <h2>GDB threading cheat sheet</h2>
                <div class="formats">
                    <a href="/gdb-thread.pdf">PDF</a>
                    <span aria-hidden="true">·</span>
                    <a href="https://gist.github.com/elmotec/99635d10683789b4eb7be708a92ac91b">Markdown</a>
                </div>
                <p>A compact reference for inspecting and debugging threads with GDB.</p>
            </li>
        </ul>
    </main>
</body>
</html>
